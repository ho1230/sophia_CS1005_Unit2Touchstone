<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery | Contact</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>

  <body>
    <header>
      <img src="./images/bakery-logo_c.png" alt="North Star Bakery Logo">
      
      <nav>
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./products.html">Products</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>
    
    <main>
      <h1>Contact North Star Bakery</h1>
      <section>
        <h2>Visit Us</h2>
        <p>Address: 315 N Brand Blvd, Glendale, CA 91203</p>
        <p>Monday–Sunday: 11:00 AM – 9:00 PM</p>
      </section>
      <section>
        <h2>Pre-Order or Questions</h2>
        <form>
          <fieldset>
            <legend>Your Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
          </fieldset>
          <fieldset>
            <legend>Request Details</legend>
            <label for="pickupDate">Pickup Date:</label>
            <input type="date" id="pickupDate" name="pickupDate" required>
            <br>
            <label for="requestType">Request Type:</label>
            <select id="requestType" name="requestType" required>
              <option value="">Select one</option>
              <option value="preorder">Pre-Order</option>
              <option value="question">General Question</option>
            </select>
            <br>
            <label for="itemDetails">Item Details:</label>
            <textarea id="itemDetails" name="itemDetails" rows="5" cols="40" required></textarea>
            <br>
            <label for="allergyNotes">Allergy Notes:</label>
            <textarea id="allergyNotes" name="allergyNotes" rows="4" cols="40"></textarea>
          </fieldset>
          <button type="submit">Submit</button>
        </form>
      </section>
    </main>
    
    <footer> <p>&copy; copyright</p> </footer>
  </body>
</html>
